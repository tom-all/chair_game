[package]
name = "chair_game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.20.1", features = ["serialize"] }
bevy_fps_controller = { version = "20", features = ["rapier"] }
bevy_rapier3d = "0.37"
lightyear = { version = "0.31", features = ["udp", "raw_connection", "input_native"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3